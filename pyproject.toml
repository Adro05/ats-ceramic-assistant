[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-ceramic-assistant"
dynamic = ["version"]
description = "Batch shade calibration assistant prototype for digitally printed ceramic tiles (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Optional cross-check of the in-house CIEDE2000 implementation (used from chunk 2).
colour-check = [
    "colour-science>=0.4",
]

[tool.setuptools.dynamic]
version = { attr = "ats_ceramic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# L, a, b are the conventional CIELAB symbol names.
ignore = ["N803", "N806", "N815"]